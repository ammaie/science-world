name: science_world
description: "Science World App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  go_router: ^14.2.0
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.3.2
  supabase_flutter: ^2.5.6
  dio: ^5.0.0
  path_provider: ^2.0.15
  pdfx: ^2.11.0
  open_file: ^3.4.0
  http: ^1.6.0
  url_launcher: ^6.1.7
  sqflite: ^2.3.0
  path: ^1.9.0
  connectivity_plus: ^6.0.3
  permission_handler: ^11.3.1
  audioplayers: ^6.0.0
  vibration: ^1.9.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
